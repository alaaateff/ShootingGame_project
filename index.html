<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forest Shooter - Main Menu</title>
  <link rel="stylesheet" href="menu_style.css">
</head>
<body>

<div id="menuContainer">

  <h1 class="title">Forest Shooter</h1>

  <button id="startBtn" class="mainBtn">Start Game</button>
  <button id="howBtn" class="mainBtn">How to Play</button>
  

  <h2 class="levelsTitle">Levels</h2>
  <div id="levelsContainer"></div>
<div style="text-align: center; margin-top: 5px;">
  <button id="resetBtn" class="mainBtn red">Reset</button>


</div>



<div id="popup" class="hidden">
  <div id="popupBox">
    <button class="close-x-btn">&times;</button> 
    <p id="popupText"></p>
    <button id="closePopup">OK</button>
  </div>
</div>



  
<audio id="clickSound" src="sounds/select.mp3" preload="auto"></audio>
<audio id="winSound" src="sounds/win.wav" preload="auto"></audio>
<audio id="victorySound" src="sounds/victory.mp3" preload="auto"></audio>
<audio id="loseSound" src="sounds/GO.mp3" preload="auto"></audio>


<script src="menu.js"></script>



</body>
</html>
